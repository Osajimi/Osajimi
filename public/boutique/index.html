<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Osajimi Catalogue</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="../assets/images/icon.png">
  <link rel="stylesheet" href="css/product-style.css">
</head>
<body>

<header class="site-header">
    <!-- Logo à gauche, nom de l'entreprise à côté -->
    <div class="header-left">
        <a href="../../index.html"><img src="../../assets/images/image_accueil.png" alt="Logo Osajimi" class="logo"></a>
        <span class="site-name">Osajimi</span>
    </div>
</header>


<header>
  <h1>Le Catalogue</h1>
</header>
<h1 class="promo"> </h1>

<div class="shop-container">

  <!-- Sidebar catégories -->
  <aside class="sidebar">
    <h2>Catégories</h2>
    <ul>
      <li><button class="filter-btn" data-filter="all">Tous</button></li>
      <li><button class="filter-btn" data-filter="emoji">Sticker</button></li>
      <li><button class="filter-btn" data-filter="art">Design & Art</button></li>
      <li><button class="filter-btn" data-filter="vtuber">Model Vtuber</button></li>
      <li><button class="filter-btn" data-filter="extras">Extras</button></li>
    </ul>
  </aside>

  <!-- Contenu produits -->
  <main class="product-list">
    <div class="product-item" data-category="emoji">
      <a href="emoji.html">
        <img src="../../assets/images/emoji.png" alt="Émoji">
        <h2>Émoji</h2>
      </a>
    </div>

    <div class="product-item" data-category="art">
      <a href="art.html">
        <img src="../../assets/images/art.png" alt="Illustration / Art">
        <h2>Illustration Personnalisé</h2>
      </a>
    </div>

    <div class="product-item" data-category="art">
      <a href="ych.html">
        <img src="../../assets/images/ych.png" alt="YCH">
        <h2>Illustration YCH</h2>
      </a>
    </div>

    <div class="product-item" data-category="vtuber">
      <a href="plushies.html">
        <img src="../../assets/images/plushie.png" alt="Plushie">
        <h2>Plushie YCH</h2>
      </a>
    </div>

    <div class="product-item" data-category="vtuber">
      <a href="Charadesign.html">
        <img src="../../assets/images/model_chan_accueil.png" alt="Charadesign">
        <h2>Charadesign</h2>
      </a>
    </div>

    <div class="product-item" data-category="vtuber">
      <a href="refsheet.html">
        <img src="../../assets/images/refsheet_accueil.png" alt="Refsheet">
        <h2>Refsheet</h2>
      </a>
    </div>

    <div class="product-item" data-category="extras">
      <a href="logo.html">
        <img src="../../assets/images/Osajimi_logo.png" alt="Logos">
        <h2>Logos</h2>
      </a>
    </div>
  </main>

</div>

<script src="js/shop.js"></script>
</body>
</html>
