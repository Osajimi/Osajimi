<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Refsheet – Produit</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/product-style.css">
</head>
<body>

<header class="site-header">
    <!-- Logo à gauche, nom de l'entreprise à côté -->
    <div class="header-left">
        <a href="../../index.html"><img src="../../assets/images/image_accueil.png" alt="Logo Osajimi" class="logo"></a>
        <span class="site-name">Osajimi</span>
    </div>
</header>

<main>

<header>
<a href="index.html" class="back-link">← Retour au Catalogue</a>
</header>

<div class="product-page">
  <div class="product-gallery">
    <div class="main-image">
      <img id="productImg" src="../../assets/images/model_ref.png" alt="Refsheet">
    </div>
    <div class="thumbnails">
      <img class="thumb active" src="../../assets/images/model_ref.png" alt="exemple1">
      <img class="thumb" src="../../assets/images/refsheet.png" alt="exemple2">
      <img class="thumb" src="../../assets/images/exemple.jpg" alt="exemple">
    </div>
  </div>

  <div class="product-info">
    <h1>Refsheet</h1>

    <!-- Tableau -->
    <table class="option-table">
      <thead>
        <tr>
          <th>Quantité/pose</th>
          <th>Prix unitaire (€)</th>
          <th>Prix total (€)</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>1</td><td>60</td><td>60</td></tr>
        <tr><td>2</td><td>60</td><td>120</td></tr>
        <tr><td>3</td><td>60</td><td>180</td></tr>
      </tbody>
    </table>

    <div class="product-options">
      <p>Type de pose :</p>
      <div class="option-buttons" id="artTypeBtns">
        <button data-value="fullbody" class="active">Fullbody</button>
        <button data-value="torso">Torso/chibi</button>
        <button data-value="face">Face</button>
      </div>

      <p>Quantité :</p>
      <input type="number" id="productQty" value="1" min="1">
    </div>

    <p class="price">Prix : <span id="productPrice">60.00€</span></p>
    <a href="chararef.html" target="_blank" class="buy-btn">Commissioner par email</a>
  </div>
</div>

<script src="js/gallery.js"></script>
<script src="js/art.js"></script>
</body>
</html>
